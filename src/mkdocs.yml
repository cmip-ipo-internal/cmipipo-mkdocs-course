site_name: CMIP-IPO Mkdocs
site_description: Teaching site and template repository
site_url: ""
# REPO_URL is set by the GitHub Actions build to whichever repository it runs
# in, so a copy of this template points at itself with no edit. The value after
# it is the fallback used for local builds.
repo_url: !ENV [REPO_URL, 'https://github.com/WCRP-CMIP/cmipipo-mkdocs-course']
repo_name: ""

# Paths are relative to this file (src/)
docs_dir: ../docs
site_dir: ../build
use_directory_urls: true

copyright: CMIP International Project Office

theme:
  name: material
  language: en
  custom_dir: overrides
  logo: assets/cmip-logo.svg
  favicon: assets/cmip-icon.svg
  icon:
    repo: fontawesome/brands/git-alt
  font:
    text: Plus Jakarta Sans
    code: Roboto Mono
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    # navigation.instant is deliberately not enabled: it swaps pages without
    # re-rendering the custom header, so the active nav highlight goes stale.
    - navigation.top
    - navigation.path
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.action.view

plugins:
  - search
  - gen-files:
      scripts: []
  - literate-nav:
      nav_file: SUMMARY.md

hooks:
  - hooks/matomo.py

extra:
  # Top-level nav titles kept out of the top bar (still in the sidebar).
  # Empty: the whole nav is shown in the top bar.
  nav_exclude: []

extra_css:
  - stylesheets/cmip.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
